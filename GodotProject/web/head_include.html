<style>
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
canvas { touch-action: none; }
#paw-audio-status { position: fixed; z-index: 20; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); max-width: min(320px, 75vw); padding: 6px 10px; border-radius: 8px; color: #fff5dd; background: #142236e8; font: 12px/1.5 system-ui, sans-serif; pointer-events: none; }
#paw-audio-status[hidden] { display: none; }
#paw-audio-diagnostic { position: fixed; z-index: 20; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); max-width: min(310px, 75vw); padding: 7px 10px; border-radius: 8px; color: #fff5dd; background: #142236ed; font: 11px/1.5 system-ui, sans-serif; white-space: pre-wrap; pointer-events: none; }
#paw-audio-diagnostic[hidden] { display: none; }
</style>
<script>
/* Passive audio observation only: never cancel, replay or manufacture game input.
   Godot's default shell initializes the engine before the game menu is usable.
   A real player gesture resumes any context blocked by the browser's policy.
   Respect saved bus levels and the device mute policy: no playback audioSession,
   hidden HTML audio loop, replacement sound, gain boost or unmute workaround. */
(function () {
  'use strict';
  if (window.pawAudio) return;
  var contexts = new Map();
  var wrappers = new Map();
  var supported = false;
  var ready = false;
  var mix = { sfx: 1, music: 1 };
  var notice = null;
  var version = '0.11';
  var diagnostic = null;
  var debugEnabled = /(?:[?&])debug=audio(?:&|$)/.test(window.location ? window.location.search : '');
  var requestId = 0;
  var gestureCount = 0;
  var lastGesture = '';
  var hidden = document.visibilityState === 'hidden';

  function activeEntries() {
    return Array.from(contexts.values()).filter(function (entry) { return entry.context.state !== 'closed'; });
  }
  function blocked() {
    var entries = activeEntries();
    return (ready && supported && entries.length === 0) || entries.some(function (entry) { return entry.context.state !== 'running'; });
  }
  function render() {
    if (!notice && document.body) {
      notice = document.createElement('div');
      notice.id = 'paw-audio-status';
      notice.setAttribute('role', 'status');
      notice.setAttribute('aria-live', 'polite');
      document.body.appendChild(notice);
    }
    if (!notice) return;
    var entries = activeEntries();
    var muted = mix.sfx <= 0.001 && mix.music <= 0.001;
    var waiting = entries.some(function (entry) { return entry.pending !== 0; });
    var failed = entries.some(function (entry) { return entry.error !== ''; });
    var text = '';
    if (ready && !hidden && !muted) {
      if (!supported) text = '浏览器不支持游戏音频';
      else if (entries.length === 0) text = '正在准备声音；稍后点击或按键开启';
      else if (blocked()) text = waiting ? '正在开启声音…' : failed ? '声音未开启，再点一下或按键重试' : '点击或按键开启声音';
    }
    notice.textContent = text;
    notice.hidden = text === '';
    renderDiagnostic();
    window.dispatchEvent(new Event('paw-audio-state'));
  }
  function renderDiagnostic() {
    if (!diagnostic && debugEnabled && document.body) {
      diagnostic = document.createElement('div');
      diagnostic.id = 'paw-audio-diagnostic';
      diagnostic.setAttribute('aria-label', 'PAW audio diagnostic');
      document.body.appendChild(diagnostic);
    }
    if (!diagnostic) return;
    diagnostic.hidden = !debugEnabled;
    if (!debugEnabled) return;
    var lines = ['PAW S.W.A.T. v' + version + ' · 音频诊断（F8关闭）',
      '音效 ' + Math.round(mix.sfx * 100) + '% / 音乐 ' + Math.round(mix.music * 100) + '%'];
    if (!contexts.size) lines.push(supported ? '上下文：尚未创建' : '音频：浏览器不支持');
    Array.from(contexts.values()).forEach(function (entry, index) {
      lines.push('上下文 ' + (index + 1) + '：' + entry.context.state + ' / 恢复 ' + entry.successes + '/' + entry.attempts);
      if (entry.error) lines.push(entry.error);
      if (!entry.worklet.supported) lines.push('Worklet：接口不可用');
      else if (entry.worklet.observer !== 'observed') lines.push('Worklet：无法观察');
      else if (!entry.modules.length) lines.push('Worklet：尚未请求模块');
      entry.modules.forEach(function (module) { lines.push('Worklet ' + module.name + '：' + module.state + (module.error ? ' / ' + module.error : '')); });
    });
    lines.push('上下文 running 仅表示运行，尚不证明设备出声');
    diagnostic.textContent = lines.join('\n');
  }
  function observeWorklets(entry) {
    var worklet = entry.context.audioWorklet;
    entry.worklet = { supported: !!worklet && typeof worklet.addModule === 'function', observer: 'unavailable' };
    entry.modules = [];
    if (!entry.worklet.supported) return;
    var nativeAddModule = worklet.addModule;
    var observedAddModule = function () {
      var args = Array.from(arguments);
      var name = String(args[0] || '').split(/[?#]/)[0].split('/').pop();
      var module = { name: name, state: 'pending', error: '' };
      entry.modules.push(module);
      var request;
      try { request = Reflect.apply(nativeAddModule, this, args); }
      catch (error) {
        module.state = 'rejected'; module.error = String(error && error.message || error);
        render(); throw error;
      }
      // Observe the original Promise and return it unchanged. No driver choice,
      // fallback, retry, gain change or replacement worklet is introduced here.
      Promise.resolve(request).then(function () { module.state = 'fulfilled'; render(); }, function (error) {
        module.state = 'rejected'; module.error = String(error && error.message || error); render();
      });
      render();
      return request;
    };
    try {
      worklet.addModule = observedAddModule;
      if (worklet.addModule === observedAddModule) entry.worklet.observer = 'observed';
    } catch (_) { /* Read-only APIs still work; diagnostic observation is optional. */ }
  }
  function recordError(entry, error) {
    var text = error && error.name ? error.name + ': ' + (error.message || '') : String(error || 'Audio request failed');
    if (entry.error !== text) console.warn('[PAW audio] ' + text);
    entry.error = text;
  }
  function suspend(entry) {
    if (entry.context.state === 'closed' || entry.context.state === 'suspended') return;
    try {
      Promise.resolve(entry.context.suspend()).catch(function (error) { recordError(entry, error); render(); });
    } catch (error) { recordError(entry, error); }
  }
  function track(context) {
    if (contexts.has(context)) return context;
    var entry = { context: context, attempts: 0, successes: 0, pending: 0, error: '', timeout: null };
    contexts.set(context, entry);
    observeWorklets(entry);
    // The standard Godot engine also calls resume() and discards its Promise.
    // Observe rejection for those calls too, while returning the same Promise
    // so our own gesture attempts can still distinguish success from failure.
    var nativeResume = context.resume.bind(context);
    context.resume = function () {
      var request;
      try { request = Promise.resolve(nativeResume()); }
      catch (error) { request = Promise.reject(error); }
      request.then(function () {
        if (context.state === 'running') entry.error = '';
        if (hidden) suspend(entry);
        render();
      }, function (error) { recordError(entry, error); render(); });
      return request;
    };
    context.addEventListener('statechange', function () {
      if (context.state === 'running') {
        entry.error = '';
        if (hidden) suspend(entry);
      }
      render();
    });
    if (hidden) suspend(entry);
    render();
    return context;
  }
  ['AudioContext', 'webkitAudioContext'].forEach(function (name) {
    var Native = window[name];
    if (typeof Native !== 'function') return;
    supported = true;
    if (!wrappers.has(Native)) {
      wrappers.set(Native, new Proxy(Native, {
        construct: function (target, args, newTarget) { return track(Reflect.construct(target, args, newTarget)); }
      }));
    }
    window[name] = wrappers.get(Native);
  });
  function resume(entry) {
    var context = entry.context;
    if (hidden || entry.pending || context.state === 'running' || context.state === 'closed') return;
    var id = ++requestId;
    entry.pending = id;
    entry.attempts++;
    entry.error = '';
    // A blocked browser may leave resume pending instead of rejecting it.
    // Release this attempt so the next genuine gesture can retry.
    entry.timeout = setTimeout(function () {
      if (entry.pending !== id) return;
      entry.pending = 0;
      entry.error = 'AudioContext.resume remained pending; retry with a gesture';
      render();
    }, 1800);
    function settle(error) {
      if (entry.pending !== id) return;
      clearTimeout(entry.timeout);
      entry.pending = 0;
      if (error) recordError(entry, error);
      else if (context.state === 'running') { entry.successes++; entry.error = ''; }
      else entry.error = 'AudioContext is still ' + context.state;
      if (hidden) suspend(entry);
      render();
    }
    try { Promise.resolve(context.resume()).then(function () { settle(null); }, settle); }
    catch (error) { settle(error); }
  }
  function gesture(event) {
    if (event.isTrusted === false || hidden || (event.type === 'keydown' && event.repeat)) return;
    gestureCount++;
    lastGesture = event.type;
    activeEntries().forEach(resume);
    render();
  }
  // Observe both press and release: touch Safari may grant activation on release.
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(function (type) {
    window.addEventListener(type, gesture, { capture: true, passive: true });
  });
  window.addEventListener('keydown', function (event) {
    if (event.isTrusted === false || event.repeat || (event.code !== 'F8' && event.key !== 'F8')) return;
    debugEnabled = !debugEnabled;
    render();
  }, { capture: true, passive: true });
  document.addEventListener('DOMContentLoaded', render, { once: true });
  document.addEventListener('visibilitychange', function () {
    hidden = document.visibilityState === 'hidden';
    if (hidden) activeEntries().forEach(suspend);
    render();
  });
  window.addEventListener('pagehide', function () { hidden = true; activeEntries().forEach(suspend); render(); });
  window.addEventListener('pageshow', function () { hidden = document.visibilityState === 'hidden'; render(); });
  // Preserve the existing local zoom protection; do not intercept touchmove.
  document.addEventListener('gesturestart', function (event) { event.preventDefault(); }, { passive: false });
  window.pawAudio = {
    setReady: function () { ready = true; render(); },
    setMix: function (levels) { mix.sfx = levels.sfx; mix.music = levels.music; render(); },
    blocked: blocked,
    snapshot: function () {
      var entries = activeEntries();
      return { version: version, diagnosticVisible: debugEnabled, contextRunning: entries.length > 0 && entries.every(function (entry) { return entry.context.state === 'running'; }), outputVerified: false, supported: supported, ready: ready, hidden: hidden, mix: { sfx: mix.sfx, music: mix.music }, gestures: gestureCount, lastGesture: lastGesture,
        contexts: Array.from(contexts.values()).map(function (entry) {
          return { state: entry.context.state, attempts: entry.attempts, successes: entry.successes, pending: !!entry.pending, error: entry.error, sampleRate: entry.context.sampleRate,
            worklet: { supported: entry.worklet.supported, observer: entry.worklet.observer, modules: entry.modules.map(function (module) { return { name: module.name, state: module.state, error: module.error }; }) } };
        }) };
    }
  };
  window.__pawAudioDebug = function () { return window.pawAudio.snapshot(); };
  render();
})();
</script>
<script>
/* Canvas-only input observation. Keep the engine's genuine touch events intact:
   no stopPropagation, document touchmove trap, replay or synthetic mouse events.
   Godot 4.6 forwards touchcancel as touchend, losing the cancel distinction. */
(function () {
  'use strict';
  if (window.pawInput) return;
  var active = new Map();
  var canceled = new Map();
  var pendingEnds = new Map();
  var seen = false;
  var revision = 0;
  var recent = [];
  function id(value) { return Number(value) | 0; }
  function remember(type, ids) {
    recent.push({ type: type, ids: ids });
    if (recent.length > 8) recent.shift();
  }
  function markCanceled(value) {
    canceled.set(id(value), true);
    // Menu/background cancels may never be consumed by a game touch controller.
    if (canceled.size > 32) canceled.delete(canceled.keys().next().value);
  }
  function observe(event) {
    seen = true;
    revision++;
    var changed = Array.from(event.changedTouches || []);
    var ids = changed.map(function (touch) { return id(touch.identifier); });
    if (event.type === 'touchstart') ids.forEach(function (value) { canceled.delete(value); });
    if (event.type === 'touchcancel') ids.forEach(markCanceled);
    if (event.type === 'touchend' || event.type === 'touchcancel') ids.forEach(function (value) {
      var queue = pendingEnds.get(value) || [];
      queue.push(event.type === 'touchcancel');
      if (queue.length > 8) queue.shift();
      pendingEnds.set(value, queue);
      if (pendingEnds.size > 32) pendingEnds.delete(pendingEnds.keys().next().value);
    });
    // targetTouches is authoritative for contacts that began on this canvas.
    // A later event also repairs a missing old touchend without dropping a
    // second finger which is still present in the live contact list.
    var live = new Map(active);
    if (event.targetTouches) {
      live.clear();
      Array.from(event.targetTouches).forEach(function (touch) { live.set(id(touch.identifier), true); });
    } else {
      // Some embedded hosts omit targetTouches. Retain changed-contact tracking
      // rather than interpreting a missing list as "all fingers released".
      ids.forEach(function (value) {
        if (event.type === 'touchstart' || event.type === 'touchmove') live.set(value, true);
        else live.delete(value);
      });
    }
    active.forEach(function (_, value) {
      if (!live.has(value) && ids.indexOf(value) === -1) markCanceled(value);
    });
    active = live;
    remember(event.type, ids);
  }
  function interrupt(event) {
    revision++;
    active.forEach(function (_, value) { markCanceled(value); });
    active.clear();
    remember(event.type, []);
  }
  function setup() {
    var canvas = document.getElementById('canvas');
    if (!canvas || canvas.dataset.pawInputObserved) return;
    canvas.dataset.pawInputObserved = 'true';

      // Capture sees cancellation before the engine's bubbling callback.
      canvas.addEventListener(type, observe, { capture: true, passive: true });
    });

    revision: function () { return revision; },
    observed: function () { return seen; },
    reset: function () { active.clear(); canceled.clear(); pendingEnds.clear(); seen = false; revision++; },
    isActive: function (value) { return active.has(id(value)); },
    consumeCancel: function (value) {
      value = id(value);
      // Buffered Godot input can deliver old cancel then a reused-ID press in
      // one frame. Keep terminal kinds in order across DOM touchstart events.
      var queue = pendingEnds.get(value);
      var result = queue && queue.length ? queue.shift() : canceled.has(value);
      if (queue && !queue.length) pendingEnds.delete(value);
      canceled.delete(value);
      return result;
    },
    snapshot: function () {
      return { observed: seen, active: Array.from(active.keys()), canceled: Array.from(canceled.keys()),

    }
  };
  window.__pawInputDebug = function () { return window.pawInput.snapshot(); };
  document.addEventListener('DOMContentLoaded', setup, { once: true });
  window.addEventListener('blur', interrupt, { passive: true });
  window.addEventListener('pagehide', interrupt, { passive: true });
  document.addEventListener('visibilitychange', function (event) {
    if (document.visibilityState === 'hidden') interrupt(event);
  }, { passive: true });
  setup();
})();
</script>
